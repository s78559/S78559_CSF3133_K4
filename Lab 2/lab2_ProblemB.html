<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Course Feedback</title>
</head>
<body>

    <!-- Header -->
    <header>
        <h1>CSF3133 Course Feedback</h1>
    </header>

    <!-- Navigation -->
    <nav>
        <a href="#results">Results</a> |
        <a href="#form">Feedback Form</a>
    </nav>

    <!-- Feedback summary -->
    <section id="results">
        <h2>Feedback Summary</h2>

        <table border="1">
            <tr>
                <th>Week</th>
                <th>Topic</th>
                <th>Rating</th>
            </tr>

            <tr>
                <td>1</td>
                <td>Introduction to HTML</td>
                <td>4.5</td>
            </tr>

            <tr>
                <td>2</td>
                <td colspan="2">Tables and Forms</td>
            </tr>

            <tr>
                <td>3</td>
                <td>Semantic HTML</td>
                <td>4.0</td>
            </tr>
        </table>
    </section>

    <!-- Feedback form -->
    <section id="form">
        <h2>Give Your Feedback</h2>

        <form action="submit_feedback.php" method="post">

            <!-- Student name -->
            <label for="name">Name:</label>
            <input type="text" id="name" name="fullname" required>
            <br><br>

            <!-- Overall rating -->
            <p>Overall Rating:</p>

            <input type="radio" id="good" name="rating" value="good">
            <label for="good">Good</label>

            <input type="radio" id="poor" name="rating" value="poor">
            <label for="poor">Poor</label>
            <br><br>

            <!-- Lab attendance -->
            <input type="checkbox" id="lab" name="labs" value="yes">
            <label for="lab">I attended all labs</label>
            <br><br>

            <!-- Submit button -->
            <input type="submit" value="Submit">

        </form>
    </section>

    <!-- Footer -->
    <footer>
        <p>Copyright &copy; 2026 CSF3133</p>
    </footer>

</body>
</html>
