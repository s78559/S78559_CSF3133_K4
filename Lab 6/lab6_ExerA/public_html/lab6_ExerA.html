<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock, Paper, Scissors Game</title>

    <!-- Link external CSS file -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Header section -->
    <header>
        <h1>Rock, Paper, Scissors</h1>
        <p>Play against the computer and see who wins!</p>
    </header>

    <main>

        <!-- Player name section -->
        <section class="player-section">
            <label for="playerName">Your name:</label>
            <input type="text" id="playerName" placeholder="Enter your name">

            <button onclick="startGame()">Start Game</button>
        </section>

        <!-- Game section -->
        <section class="game-section">

            <h2>Choose Your Move</h2>

            <div class="buttons">
                <button onclick="playRound('rock')">Rock</button>
                <button onclick="playRound('paper')">Paper</button>
                <button onclick="playRound('scissors')">Scissors</button>
            </div>

            <!-- Player and Computer images -->
            <div class="players">

                <div class="player">
                    <h3>You</h3>
                    <img id="playerImg" src="rock.png" alt="Player Choice">
                    <p id="playerChoice">Rock</p>
                </div>

                <div class="vs">VS</div>

                <div class="player">
                    <h3>Computer</h3>
                    <img id="computerImg" src="rock.png" alt="Computer Choice">
                    <p id="computerChoice">Rock</p>
                </div>

            </div>

            <!-- Result section -->
            <div class="result-section">
                <h2 id="result">Result will appear here</h2>
            </div>

        </section>

        <!-- Scoreboard section -->
        <section class="scoreboard">

            <h2>Scoreboard</h2>

            <p>
                Wins: <span id="wins">0</span>
                |
                Losses: <span id="losses">0</span>
                |
                Draws: <span id="draws">0</span>
            </p>

        </section>

        <!-- History section -->
        <section class="history-section">

            <h2>History</h2>

            <table id="history">

                <thead>
                    <tr>
                        <th>Round</th>
                        <th>You</th>
                        <th>Computer</th>
                        <th>Result</th>
                    </tr>
                </thead>

                <tbody id="historyBody">
                </tbody>

            </table>

            <div class="action-buttons">
                <button onclick="showSummary()">Show Summary</button>
                <button onclick="resetGame()">Reset</button>
            </div>

            <p id="summary"></p>

        </section>

    </main>

    <!-- Footer -->
    <footer>
        <p id="startTime"></p>
        <p>&copy; 2026 Computer Science Club</p>
    </footer>

    <!-- Link external JavaScript file -->
    <script src="game.js"></script>

</body>
</html>
